name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # crear el GitHub Release y subir assets

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: brew install xcodegen create-dmg

      - name: Extraer versión del tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar (.app universal, firma ad-hoc)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/bundle.sh

      - name: Empaquetar DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/make-dmg.sh

      - name: Crear GitHub Release y subir DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/AvangenioStatus.dmg" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Actualizar Homebrew Cask en el tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: avangenio-status-ci
          GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/update-cask.sh "$VERSION" "dist/AvangenioStatus.dmg"
