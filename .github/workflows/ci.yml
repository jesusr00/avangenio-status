name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode más reciente
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild build \
            -project AvangenioStatus.xcodeproj \
            -scheme AvangenioStatus \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Tests
        run: |
          xcodebuild test \
            -project AvangenioStatus.xcodeproj \
            -scheme AvangenioStatus \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
